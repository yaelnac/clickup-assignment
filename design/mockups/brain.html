<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1470px;height:710px;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#fafafa;color:#1f1f1f;font-size:14px;-webkit-font-smoothing:antialiased;position:relative}
svg{display:block;flex:none}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center}
/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:38px}
.ws{position:absolute;left:6px;top:6px;height:27px;padding:0 10px 0 5px;border-radius:7px;background:#efefef;gap:8px;font-weight:600;font-size:14px}
.ws .h{width:18px;height:18px;border-radius:4px;background:#3f9e8f;color:#fff;font-size:12px;display:grid;place-items:center;font-weight:600}
.search{position:absolute;left:588px;top:5px;width:296px;height:28px;border:1px solid #e3e3e3;border-radius:8px;background:#fff;gap:6px;padding:0 4px 0 10px;color:#8a8a8a;font-size:13px}
.search .chip{margin-left:auto;background:#f0f0f0;border-radius:6px;height:20px;padding:0 6px;gap:4px;color:#555;font-size:12px}
.avatar{position:absolute;right:8px;top:7px;width:24px;height:24px;border-radius:50%;background:#1f1f1f;color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
/* rail */
.rail{position:absolute;left:6px;top:38px;bottom:0;width:48px;background:#000;border-radius:10px 10px 0 0;color:#fff}
.ri{position:absolute;left:0;width:48px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}
.ri .ic{width:17px;height:17px}
.home{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#c66bf2,#7c4dff 70%);display:grid;place-items:center;box-shadow:0 0 12px rgba(160,90,255,.5)}
/* app card */
.app{position:absolute;left:60px;top:38px;right:6px;bottom:0;background:#fff;border:1px solid #e6e6e6;border-bottom:0;border-radius:10px 10px 0 0;overflow:hidden}
.side{position:absolute;left:0;top:0;bottom:0;width:236px;background:#f9f9f9;border-right:1px solid #e8e8e8}
.side .hd{position:absolute;left:16px;top:16px;font-size:16px;font-weight:600}
.create{position:absolute;left:148px;top:12px;height:25px;padding:0 9px;border-radius:6px;background:#1f1f1f;color:#fff;gap:5px;font-size:13px;font-weight:500}
.create .ic{width:13px;height:13px}
.si{position:absolute;left:16px;gap:9px;color:#646464;font-size:14px}
.si .ic{width:15px;height:15px}
.div{position:absolute;left:16px;right:18px;height:1px;background:#e3e3e3}
.lab{position:absolute;left:16px;font-size:12px;color:#7a7a7a}
.sq{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:#fff}
.sq .ic{width:11px;height:11px}
.sel{position:absolute;left:31px;width:197px;height:28px;border-radius:6px;background:#efedfb}
.tree{position:absolute;width:1px;background:#e0e0e0}
/* main */
.main{position:absolute;left:236px;top:0;right:0;bottom:0}
.crumb{position:absolute;left:17px;top:16px;gap:8px;font-size:14px;color:#6a6a6a}
.crumb b{color:#1f1f1f;font-weight:600;font-size:14.5px}
.tr{position:absolute;right:18px;top:15px;gap:16px;color:#646464;font-size:13.5px}
.tr span{display:flex;gap:6px;align-items:center}
.tabs{position:absolute;left:17px;top:52px;gap:16px;font-size:13.5px;color:#555}
.tabs span{display:flex;gap:6px;align-items:center;height:28px}
.tabs .on{color:#1f1f1f;font-weight:600;box-shadow:inset 0 -2px 0 #1f1f1f}
.tab-ic{width:15px;height:15px;border-radius:3px;display:grid;place-items:center;color:#fff;font-size:8px;font-weight:700}
.rule{position:absolute;left:0;right:0;top:80px;height:1px;background:#e8e8e8}
.tool{position:absolute;left:14px;top:92px;gap:6px}
.chip2{height:26px;border-radius:13px;border:1px solid #e3e3e3;padding:0 10px;gap:5px;font-size:12.5px;color:#4a4a4a;display:flex;align-items:center}
.chip2.lav{background:#f0f1fe;border-color:#dcdcfb;color:#5146d9}
.chip2 .ic{width:13px;height:13px}
.toolr{position:absolute;right:18px;top:92px;gap:6px}
.addt{height:26px;border-radius:6px;background:#1f1f1f;color:#fff;font-size:12.5px;font-weight:500;display:flex;align-items:center}
.addt span{padding:0 10px}
.addt i{width:24px;height:26px;border-left:1px solid #444;display:grid;place-items:center}
/* banner */
.banner{position:absolute;left:22px;right:30px;top:137px;height:64px;border:1px solid #dcd8fb;background:#f6f4ff;border-radius:12px;gap:14px;padding:0 18px 0 20px}
.brainlogo{width:16px;height:16px}
.banner .brainlogo{width:26px;height:26px}
.btxt b{display:block;font-size:15px;font-weight:600;color:#1f1f1f}
.btxt small{display:block;font-size:13px;color:#6a6a6a;margin-top:2px}
.bact{margin-left:auto;gap:16px;font-size:13.5px}
.trial{background:#e6f6ec;color:#1f8a4c;border-radius:4px;padding:3px 7px;font-size:12px;font-weight:500}
.notnow{color:#6a6a6a}
.draft{height:32px;padding:0 14px;border-radius:7px;background:#7b68ee;color:#fff;font-weight:600;gap:7px;display:flex;align-items:center}
.draft .ic{width:13px;height:13px}
/* table */
.th{position:absolute;left:22px;right:28px;height:28px;border-bottom:1px solid #ececec;font-size:12px;color:#8a8a8a}
.th .n{position:absolute;left:26px;top:7px}
.th .a{position:absolute;left:745px;top:7px}
.th .d{position:absolute;left:975px;top:7px}
.grp{position:absolute;left:22px;gap:8px;font-size:13.5px;font-weight:600}
.grp em{font-style:normal;font-weight:400;color:#8a8a8a}
.grp .ic{width:14px;height:14px;color:#555}
.task{position:absolute;left:22px;right:28px;height:42px;border-bottom:1px solid #efefef;font-size:13.5px}
.task .t{position:absolute;left:28px;top:12px;gap:9px;display:flex;align-items:center}
.task .c{display:flex;gap:3px;align-items:center;color:#8a8a8a;font-size:11.5px;margin-left:4px}
.task .c .ic{width:12px;height:12px}
.badge{font-size:11px;border-radius:4px;padding:2px 6px;font-weight:500}
.ok{background:#e6f6ec;color:#1f8a4c}.ip{background:#e8f0fe;color:#3b6fd8}
.as{position:absolute;left:745px;top:10px;gap:8px;display:flex;align-items:center}
.av{width:22px;height:22px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.du{position:absolute;left:975px;top:12px}
.addtask{position:absolute;left:48px;gap:8px;color:#8a8a8a;font-size:13.5px}
/* brain panel */
.panel{position:absolute;right:0;top:0;bottom:0;width:470px;background:#fff;border-left:1px solid #e6e6e6;box-shadow:-8px 0 24px rgba(0,0,0,.04)}
.ph{position:absolute;left:16px;right:14px;top:12px;height:24px;gap:8px;font-size:13.5px;font-weight:600}
.ph .r{margin-left:auto;gap:12px;color:#8a8a8a;display:flex}
.umsg{position:absolute;right:16px;top:54px;background:#f2f2f2;border-radius:10px;padding:8px 12px;font-size:13px}
.src{position:absolute;left:16px;right:16px;top:98px;gap:6px;color:#8a8a8a;font-size:12px}
.src .ic{width:12px;height:12px}
.card{position:absolute;left:16px;right:14px;top:120px;border:1px solid #e8e8e8;border-radius:10px;padding:12px 14px}
.card h4{font-size:14.5px;font-weight:600;margin-bottom:8px}
.card .sec{font-size:12.5px;color:#6a6a6a;font-weight:500;margin-top:9px}
.card ul{margin:3px 0 0 17px;font-size:13px;line-height:1.55;color:#2a2a2a}
.muted .card h4,.muted .card ul{color:#9a9a9a}
.acts{position:absolute;left:16px;right:14px;gap:14px;color:#6a6a6a;font-size:11.5px}
.acts span{display:flex;gap:4px;align-items:center}
.acts .ic{width:12px;height:12px}
.acts .r{margin-left:auto;gap:8px;display:flex}
.input{position:absolute;left:16px;right:14px;bottom:14px;height:34px;border:1px solid #e3e3e3;border-radius:9px;gap:7px;padding:0 10px;color:#9a9a9a;font-size:12.5px}
.input .ic{width:13px;height:13px}
.every{position:absolute;left:16px;right:14px;border:1px solid #dcd8fb;background:#f6f4ff;border-radius:10px;padding:12px 14px}
.every b{display:block;font-size:14px;font-weight:600}
.every small{display:block;font-size:12.5px;color:#6a6a6a;margin-top:3px;line-height:1.45}
.every .btns{margin-top:10px;gap:10px;font-size:12px}
.every .go{height:26px;padding:0 10px;border-radius:6px;background:#7b68ee;color:#fff;font-weight:600;gap:6px;display:flex;align-items:center}
.every .go .ic{width:13px;height:13px}
.another{position:absolute;left:16px;gap:6px;color:#6a6a6a;font-size:11.5px}
.another .ic{width:12px;height:12px}
.toast{position:absolute;left:560px;top:658px;transform:translateX(-50%);background:#1f1f1f;color:#fff;border-radius:7px;padding:7px 12px;gap:7px;font-size:12px}
.toast .ic{width:12px;height:12px;color:#7fe0a3}
</style></head>
<body>

<script>
